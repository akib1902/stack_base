name: stackbase_mobile
description: StackBase mobile client for Android and iOS.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: 3.13.7
  flutter: 3.47.9

dependencies:
  flutter:
    sdk: flutter
  collection: 1.19.1
  connectivity_plus: 7.3.2
  cupertino_icons: 1.0.8
  dio: 5.11.1
  flutter_riverpod: 3.4.3
  flutter_secure_storage: 11.2.0
  freezed_annotation: 3.1.0
  go_router: 18.1.2
  intl: 0.20.3
  json_annotation: 4.12.0
  package_info_plus: 10.2.2
  shared_preferences: 2.5.6
  supabase_flutter: 2.18.3
  uuid: 4.6.0

dev_dependencies:
  build_runner: 2.17.1
  flutter_lints: 6.0.0
  flutter_test:
    sdk: flutter
  freezed: 4.0.3
  integration_test:
    sdk: flutter
  json_serializable: 6.15.2
  mocktail: 1.0.5

flutter:
  uses-material-design: true
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
